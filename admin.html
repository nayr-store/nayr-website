<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAYR Admin</title><link rel="stylesheet" href="/style.css"></head><body><header class="site-head"><a class="brand" href="/">NAYR<span>.</span><small>ADMIN DASHBOARD</small></a><a href="/">শপ দেখুন</a></header><main class="container admin-wrap"><section id="loginBox" class="admin-panel"><h2>Admin Login</h2><form id="loginForm"><input class="field" name="username" placeholder="Username" required><input class="field" name="password" type="password" placeholder="Password" required><button class="gold-btn full">Login</button></form><p id="loginMsg" class="muted"></p></section>
<section id="dashboard" hidden><div class="section-head"><h2>Admin Dashboard</h2><button id="logout" class="add">Logout</button></div><nav class="chips"><button class="chip active" data-tab="products">পণ্য</button><button class="chip" data-tab="orders">অর্ডার</button><button class="chip" data-tab="settings">শপ সেটিংস</button><button class="chip" data-tab="password">পাসওয়ার্ড</button></nav>
<div id="tab-products" class="admin-panel"><h3>পণ্য যোগ / সম্পাদনা</h3><form id="productForm"><input type="hidden" name="id"><input class="field" name="name" placeholder="পণ্যের নাম" required><select class="field" name="category" id="category" required></select><textarea class="field" name="description" placeholder="বর্ণনা"></textarea><input class="field" name="price" type="number" min="0" step="0.01" placeholder="দাম (টাকা)" required><input class="field" name="stock" type="number" min="0" placeholder="স্টক সংখ্যা"><input class="field" name="image" placeholder="ছবির URL (ঐচ্ছিক)"><label>অথবা ছবি আপলোড (সর্বোচ্চ ৩ MB)</label><input class="field" type="file" id="imageFile" accept="image/png,image/jpeg,image/webp,image/gif"><button class="gold-btn">সংরক্ষণ করুন</button><button type="button" class="chip" id="resetProduct">ফর্ম পরিষ্কার</button></form><p id="productMsg" class="muted"></p><h3>বর্তমান পণ্য</h3><div id="productList"></div></div>
<div id="tab-orders" class="admin-panel" hidden><h3>কাস্টমার অর্ডার</h3><div id="ordersList"></div></div>
<div id="tab-settings" class="admin-panel" hidden><h3>শপের তথ্য</h3><form id="settingsForm"><input class="field" name="store_name" placeholder="শপের নাম"><input class="field" name="tagline" placeholder="Tagline"><input class="field" name="announcement" placeholder="উপরের ঘোষণা"><input class="field" name="whatsapp" placeholder="WhatsApp নম্বর (দেশের কোডসহ)"><input class="field" name="bkash" placeholder="bKash নম্বর"><input class="field" name="nagad" placeholder="Nagad নম্বর"><button class="gold-btn">সেটিংস সংরক্ষণ</button></form><p id="settingsMsg" class="muted"></p></div>
<div id="tab-password" class="admin-panel" hidden><h3>Admin Password পরিবর্তন</h3><form id="passwordForm"><input class="field" type="password" name="current_password" placeholder="বর্তমান পাসওয়ার্ড" required><input class="field" type="password" name="new_password" placeholder="নতুন পাসওয়ার্ড (কমপক্ষে ১২ অক্ষর)" required><button class="gold-btn">পাসওয়ার্ড পরিবর্তন</button></form><p id="passwordMsg" class="muted"></p></div></section></main><script src="/admin.js"></script></body></html>
